<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Simulador CNC Elephant</title>
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
        "three/examples/jsm/controls/OrbitControls": "https://unpkg.com/three@0.161.0/examples/jsm/controls/OrbitControls.js",
        "three/examples/jsm/loaders/STLLoader": "https://unpkg.com/three@0.161.0/examples/jsm/loaders/STLLoader.js"
      }
    }
    </script>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div id="hud">
        <div class="hud-header">
            <div>
                <div class="eyebrow">CNC Runtime View</div>
                <h1>Elephant Visualizer</h1>
                <p>Simulacion 3D de maquina, trayectorias y pieza en una sola cabina.</p>
            </div>
            <div class="status-pill">LIVE</div>
        </div>

        <div class="panel-section">
            <div class="section-title">Carga</div>
            <div class="field-block">
                <label for="fileInput">G-Code</label>
                <input id="fileInput" type="file" />
            </div>
            <div class="field-block">
                <label for="beamInput">Viga STL</label>
                <input id="beamInput" type="file" />
            </div>
        </div>

        <div class="panel-section">
            <div class="section-title">Ejecucion</div>
            <div class="button-grid button-grid-3">
                <button id="btnPlay">Play</button>
                <button id="btnPause">Pausa</button>
                <button id="btnReset">Reset</button>
            </div>
            <div class="button-grid button-grid-2 compact-gap">
                <button id="btnEjemplo">Ejemplo</button>
                <button id="btnTraceMode">Traza</button>
            </div>
        </div>

        <div class="panel-section">
            <div class="section-title">Camara y velocidad</div>
            <div class="button-grid button-grid-2 compact-gap">
                <button id="btnViewIso">Iso</button>
                <button id="btnViewTop">Planta</button>
            </div>
            <div class="range-row">
                <label for="speed">Velocidad</label>
                <input id="speed" type="range" min="1" max="300" value="60" />
                <span id="speedVal">60 seg/s</span>
            </div>
        </div>

        <div class="panel-section">
            <div class="section-title">Origen pieza</div>
            <div class="origin-grid">
                <div class="axis-field">
                    <label for="originX">X</label>
                    <input id="originX" type="number" value="0" />
                </div>
                <div class="axis-field">
                    <label for="originY">Y</label>
                    <input id="originY" type="number" value="0" />
                </div>
                <div class="axis-field">
                    <label for="originZ">Z</label>
                    <input id="originZ" type="number" value="0" />
                </div>
            </div>
            <div class="button-grid button-grid-2 compact-gap">
                <button id="btnOriginApply">Aplicar Origen</button>
                <button id="btnOriginZero">0,0,0</button>
            </div>
        </div>

        <div class="info">
            <div id="estado">ESTADO: CARGANDO...</div>
            <div id="linea">Línea: -</div>
            <div id="xyz">XYZ prog: -</div>
            <div id="xyzMach">XYZ maq: -</div>
            <div id="tool">T: -</div>
        </div>

        <div class="hud-footer">Atajos: <span>P</span> play/pause, <span>N</span> paso a paso.</div>
    </div>
    <canvas id="view"></canvas>
    <script type="module" src="./app.js"></script>
</body>
</html>
